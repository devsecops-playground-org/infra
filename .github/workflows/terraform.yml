# Infrastructure uses the same platform pipeline as every application repo.
# Cloud access is keyless: the plan/apply jobs assume the AWS_ROLE_ARN role via a
# short-lived GitHub OIDC token — no AWS key is stored.
name: terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stacks:
    strategy:
      fail-fast: false
      matrix:
        project: [arteamis, botanary, tasmil]
    uses: devsecops-playground-org/platform/.github/workflows/terraform-apply.yml@v1
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      working_directory: projects/${{ matrix.project }}
      cloud: aws
      apply: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # The dispatcher is this org's own pinned @v1 workflow, not a third party;
    # inheriting secrets to it is the intended design.
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
